<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,
        body {
            min-height: 100vh;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
        }

        #sidebar {
            /* responsive sidebar with min/max using clamp */
            width: clamp(220px, 20%, 420px);
            background: #f4f4f4;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative; /* ensure absolutely positioned footer sits inside sidebar */
            z-index: 9999;
        }

        #sidebarContent {
            flex: 1 1 auto;
            overflow-y: auto;
            /* keep space for the bottom button so it's not overlapped */
            padding-bottom: 12px;
            min-height: 0; /* allow flex child to shrink and enable scrolling */
        }

        /* footer inside sidebar placed by flex; margin-top:auto pushes it to the bottom */
        #sidebarBottom {
            position: relative;
            margin-top: auto;
            background: #fff;
            padding: 8px 0 8px 0;
            border-top: 1px solid #e0e0e0;
            left: 0;
            right: 0;
            z-index: 50; /* ensure visible above tiles */
        }
        /* Make the Skip button non-selectable to avoid interfering with drag gestures */
        #sidebarBottom button {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        /* Prevent selection on tile/title/svg wrapper to avoid blocking drag */
        .tile, .tileTitle, .svg-wrapper, #sidebarContent {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #placedPanel {
            display: none;
            margin-top: 8px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e0e0e0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #burgerButton {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .tile {
            margin: 10px 0;
            padding: 6px;
            background: #fff;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .tileTitle {
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 8px;
            color: #222;
            cursor: grab;
        }

        /* SVG wrapper ensures square SVG */
        .svg-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; /* force square */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
            box-sizing: border-box;
        }

        .svg-wrapper svg {
            width: 92%;
            height: 92%;
            max-width: 100%;
            max-height: 100%;
            display: block;
            cursor: grab; /* indicate draggable */
        }

        .svg-wrapper svg:active {
            cursor: grabbing;
        }

        .tileLabel {
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            color: #222;
        }

        #cesiumContainer {
            flex: 1 1 auto;
            /* don't use fixed viewport height here; let flexbox distribute space */
            position: relative;
            min-width: 0; /* allow flex children to shrink properly */
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* More specific rules to force the Cesium widget to grow inside the flex container */
        #cesiumContainer > .cesium-viewer,
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport,
        #cesiumContainer > .cesium-viewer, #cesiumContainer > .cesium-viewer .cesium-widget, #cesiumContainer canvas {
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            flex: 1 1 auto;
        }
        /* ensure the direct viewer element grows to fill the parent */
        #cesiumContainer > .cesium-viewer { display: flex; flex-direction: column; }
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport { flex: 1 1 auto; }

        /* hide default Cesium UI elements we don't want */
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-bottom,
        .cesium-viewer-fullscreenContainer,
        .cesium-button,
        .cesium-navigationHelpButton-wrapper {
            display: none !important;
        }
    </style>
    <title>Giant Globe Puzzle</title>
</head>

<body>
    <div id="sidebar">

    <script type="module">
        // Restore a working Cesium Ion access token (previously used in this project).
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhYWUxMjgyOC04YjI0LTQ0NGUtYjM0OC0wMWQ1MGJkNWVjZjYiLCJpZCI6MjQwNDc3LCJpYXQiOjE3MjU5ODAxMDB9.Ml_ZTxTk_V86bdUOdoJ0k8klK7iyN-0atpz-KXvvYRs';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProviderViewModels: Cesium.createDefaultTerrainProviderViewModels(),
            selectedTerrainProviderViewModel: Cesium.createDefaultTerrainProviderViewModels()[0]
        });

        } catch (e) { /* ignore */ }

        // list of files (trimmed) - kept as in your workspace
        const file_list = [
            "Afghanistan","AkrotiriandDhekelia","Åland","Albania","Algeria","AmericanSamoa","Andorra","Angola","Anguilla","AntiguaandBarbuda","Argentina","Armenia","Aruba","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bermuda","Bhutan","Bolivia","BonaireSintEustatiusandSaba","BosniaandHerzegovina","Botswana","BouvetIsland","Brazil","BritishIndianOceanTerritory","BritishVirginIslands","Brunei","Bulgaria","BurkinaFaso","Burundi","CaboVerde","Cambodia","Cameroon","Canada","CaymanIslands","CentralAfricanRepublic","Chad","Chile","China","ChristmasIsland","ClippertonIsland","CocosIslands","Colombia","Comoros","CookIslands","CostaRica","CôtedIvoire","Croatia","Cuba","Curaçao","Cyprus","Czechia","DemocraticRepublicoftheCongo","Denmark","Djibouti","Dominica","DominicanRepublic","Ecuador","Egypt","ElSalvador","EquatorialGuinea","Eritrea","Estonia","Eswatini","Ethiopia","FalklandIslands","FaroeIslands","Fiji","Finland","France","FrenchGuiana","FrenchPolynesia","FrenchSouthernTerritories","Gabon","Gambia","Georgia","Germany","Ghana","Gibraltar","Greece","Greenland","Grenada","Guadeloupe","Guam","Guatemala","Guernsey","Guinea-Bissau","Guinea","Guyana","Haiti","HeardIslandandMcDonaldIsland","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","IsleofMan","Israel","Italy","Jamaica","Japan","Jersey","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","MarshallIslands","Martinique","Mauritania","Mauritius","Mayotte","México","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Montserrat","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","NewCaledonia","NewZealand","Nicaragua","Niger","Nigeria","Niue","NorfolkIsland","NorthKorea","NorthernCyprus","NorthMacedonia","NorthernMarianaIslands","Norway","Oman","Pakistan","Palau","Palestine","Panama","PapuaNewGuinea","ParacelIslands","Paraguay","Peru","Philippines","PitcairnIslands","Poland","Portugal","PuertoRico","Qatar","Réunion","Romania","Russia","Rwanda","Saint-Barthélemy","Saint-Martin","SaintHelena,AscensionandTristandaCunha","SaintKittsandNevis","SaintLucia","SaintPierreandMiquelon","SaintVincentandtheGrenadines","Samoa","SanMarino","SãoToméandPríncipe","SaudiArabia","Senegal","Serbia","Seychelles","SierraLeone","Singapore","SintMaarten","Slovakia","Slovenia","SolomonIslands","Somalia","SouthAfrica","SouthGeorgiaandtheSouthSandwichIslands","SouthKorea","SouthSudan","Spain","SpratlyIslands","SriLanka","Sudan","Suriname","SvalbardandJanMayen","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Togo","Tokelau","Tonga","TrinidadandTobago","Tunisia","Turkey","Turkmenistan","TurksandCaicosIslands","Tuvalu","Uganda","Ukraine","UnitedArabEmirates","UnitedKingdom","UnitedStates","UnitedStatesMinorOutlyingIslands","Uruguay","Uzbekistan","Vanuatu","Vatican","Venezuela","Vietnam","VirginIslands,US","WallisandFutuna","WesternSahara","Yemen","Zambia","Zimbabwe","RepublicoftheCongo","Timor-Leste"
        ];

        const sidebarContent = document.getElementById('sidebarContent');
        const skipSidebar = document.getElementById('skipSidebar');
        const burgerButton = document.getElementById('burgerButton');
        const placedPanel = document.getElementById('placedPanel');

        // state
        let currentDisplayedProvince = null;
        let currentIndex = -1;
        const placedProvinces = []; // { name, displayName, country }
        let lastDataSource = null;

        function isPlaced(name) { return placedProvinces.some(p => p.name === name); }
        function registerPlacedProvince(name, displayName, country) {
            if (isPlaced(name)) return;
            placedProvinces.push({ name, displayName, country });
            updatePlacedPanel();
        }

        function updatePlacedPanel() {
            if (!placedPanel) return;
            placedPanel.innerHTML = '';
            const groups = {};
            placedProvinces.forEach(p => { const k = p.country || 'Unknown'; (groups[k] = groups[k] || []).push(p); });
            Object.keys(groups).forEach(country => {
                const h = document.createElement('div'); h.style.fontWeight='bold'; h.style.marginTop='6px'; h.textContent = country; placedPanel.appendChild(h);
                const ul = document.createElement('ul'); ul.style.paddingLeft='16px';
                groups[country].forEach(p => {
                    const li = document.createElement('li'); li.style.cursor='pointer'; li.textContent = p.displayName || p.name;
                    li.addEventListener('click', () => {
                        // fly to entity with matching name or property
                        viewer.dataSources._dataSources.forEach(ds => ds.entities.values.forEach(ent => {
                            if ((ent.name === p.displayName) || (ent.properties && ent.properties.Name_1 && ent.properties.Name_1 === p.displayName)) {
                                viewer.flyTo(ent).catch(() => {});
                            }
                        }));
                    });
                    ul.appendChild(li);
                });
                placedPanel.appendChild(ul);
            });
        }

        function pickDifferentProvince() {
            if (!file_list || file_list.length === 0) return null;
            let startIdx = (currentIndex >= 0 && currentIndex < file_list.length) ? (currentIndex + 1) % file_list.length : 0;
            for (let i=0;i<file_list.length;i++){
                const idx=(startIdx+i)%file_list.length; const candidate=file_list[idx];
                if (!isPlaced(candidate) && candidate!==currentDisplayedProvince) { return candidate; }
            }
            return null;
        }
        function getRandomProvince(){ const candidates = file_list.filter(n=>!isPlaced(n)); return candidates.length? candidates[Math.floor(Math.random()*candidates.length)] : null; }

        function createSVGPath(geometry, svgWidth, svgHeight){
            if (!geometry) return '';
            const bbox = turf.bbox(geometry);
            let [xmin, ymin, xmax, ymax] = bbox;
            // Defensive: ensure non-zero ranges
            const lonRange = (xmax - xmin) || 1e-6;
            const latRange = (ymax - ymin) || 1e-6;

            const scaleX = svgWidth / lonRange;
            const scaleY = svgHeight / latRange;
            // Use scaleX to maximize horizontal usage (user requested max width)
            let scale = scaleX;

            // If scale is infinite/zero fallback to min
            if (!isFinite(scale) || scale <= 0) scale = Math.min(scaleX, scaleY) || 1;

            // compute vertical offset to center the shape vertically inside svgHeight
            const usedHeight = latRange * scale;
            const yOffset = Math.max(0, (svgHeight - usedHeight) / 2);

            const coords = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
            let path = '';

            coords.forEach(polygon => polygon.forEach(ring => {
                const projected = ring.map(([lon, lat]) => {
                    const x = (lon - xmin) * scale; // scaled to fill width
                    // invert y and apply vertical centering
                    const y = svgHeight - ((lat - ymin) * scale) - yOffset;
                    return `${x},${y}`;
                });
                path += `M${projected.join('L')}Z `;
            }));

            return path.trim();
         }

        function addPointToGlobe(provinceName, geometry){
            try{
                const center = turf.center(geometry); const [lon,lat]=center.geometry.coordinates;
                const ent = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(lon,lat), point:{ pixelSize:8, color:Cesium.Color.WHITE } });
                ent.provinceName = provinceName; ent.featureGeometry = geometry;
                return ent;
            }catch(e){ return null; }
        }

        async function loadAllFeatures(){
            for(const provinceName of file_list){
                try{ const resp = await fetch(`./states/${provinceName}.json`); if(!resp.ok) continue; const geoJson = await resp.json(); if(geoJson.features && Array.isArray(geoJson.features)) geoJson.features.forEach(f=> addPointToGlobe(provinceName,f.geometry)); }catch(e){/*ignore*/}
            }
        }
        loadAllFeatures();

        async function loadProvinceByName(provinceName){
            if(!provinceName) return;
            try{
                const resp = await fetch(`./states/${provinceName}.json`);
                if(!resp.ok) return;
                const geoJson = await resp.json(); if(geoJson.features && geoJson.features.length>0){
                    const props=geoJson.features[0].properties; const geometry=geoJson.features[0].geometry; const displayName = props.Name_1 || props.Country || provinceName;
                    // tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.id = provinceName;
                    // tile is not draggable anymore; the SVG inside is draggable
                    tile.textContent = '';

                    // create square svg wrapper and a label; make SVG draggable (so user drags the svg)
                    const svgWidth = 300, svgHeight = 300; // square svg surface
                    const wrapper = document.createElement('div'); wrapper.className = 'svg-wrapper';
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    svg.style.border = '1px solid #ddd';
                    // Do NOT make the inner <svg> itself draggable; make the wrapper draggable
                    svg.draggable = true;
                    // make the wrapper draggable so dragging works consistently across browsers
                    wrapper.draggable = true;
                    // Make both the svg and the wrapper (and the tile and the title) draggable — attach same handlers
                    svg.draggable = true;
                    wrapper.draggable = true;
                    tile.draggable = true;
                    const onDragStart = (e, el) => {
                        try { e.dataTransfer.setData('text/plain', provinceName); } catch (err) {}
                        e.dataTransfer.effectAllowed = 'copy';
                        try { el.classList.add('dragging'); } catch (err) {}
                        // debug log to confirm dragstart
                        try { console.log('[dragstart]', provinceName, el && el.className); } catch (err) {}
                        // set a drag image using the wrapper if possible
                        try {
                            const rect = wrapper.getBoundingClientRect();
                            e.dataTransfer.setDragImage(wrapper, rect.width / 2, rect.height / 2);
                        } catch (err) { /* ignore */ }
                    };
                    const onDragEnd = (e, el) => { try { el.classList.remove('dragging'); } catch (err) {} };
                    wrapper.addEventListener('dragstart', (e) => onDragStart(e, wrapper));
                    wrapper.addEventListener('dragend', (e) => onDragEnd(e, wrapper));
                    svg.addEventListener('dragstart', (e) => onDragStart(e, svg));
                    svg.addEventListener('dragend', (e) => onDragEnd(e, svg));
                    tile.addEventListener('dragstart', (e) => onDragStart(e, tile));
                    tile.addEventListener('dragend', (e) => onDragEnd(e, tile));

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', createSVGPath(geometry, svgWidth, svgHeight));
                    path.setAttribute('fill', 'rgba(0,123,255,0.5)');
                    path.setAttribute('stroke', '#007bff');
                    path.setAttribute('stroke-width', '1');
                    svg.appendChild(path);
                    wrapper.appendChild(svg);

                    // title above the SVG
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'tileTitle';
                    titleDiv.textContent = displayName;
                    // make the title draggable too (same behaviour as wrapper) to ease drag start
                    titleDiv.draggable = true;
                    titleDiv.addEventListener('dragstart', (e) => {
                        try { e.dataTransfer.setData('text/plain', provinceName); } catch (err) {}
                        e.dataTransfer.effectAllowed = 'copy';
                        titleDiv.classList.add('dragging');
                        try {
                            const rect = titleDiv.getBoundingClientRect();
                            e.dataTransfer.setDragImage(titleDiv, rect.width / 2, rect.height / 2);
                        } catch (err) {}
                    });
                    titleDiv.addEventListener('dragend', () => titleDiv.classList.remove('dragging'));

                     sidebarContent.innerHTML = '';
                    // append title and wrapper inside the tile so the whole tile is one draggable area
                    tile.appendChild(titleDiv);
                    tile.appendChild(wrapper);
                    sidebarContent.appendChild(tile);

                     currentDisplayedProvince = provinceName; currentIndex = file_list.indexOf(provinceName);
                }
            }catch(e){/*ignore*/}
        }

        async function loadRandomProvince(){ const p = getRandomProvince(); if(p) await loadProvinceByName(p); }
        loadRandomProvince();

        // ensure Cesium infoBox is hidden unless we set viewer.selectedEntity on polygons
        if(viewer && viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display='none';

        function displayProvinceOnGlobe(inputGeometry){
            if(!inputGeometry) return;
            // sanitize and load
            const geom = inputGeometry.type==='Feature'? inputGeometry.geometry : inputGeometry;
            if(!geom) return;
            // minimal sanitization and pass to GeoJsonDataSource
            Cesium.GeoJsonDataSource.load({ type:'Feature', geometry:geom, properties:{} }, { clampToGround:false }).then(ds=>{
                if(lastDataSource){ try{ viewer.dataSources.remove(lastDataSource,true); }catch(e){} lastDataSource=null; }
                viewer.dataSources.add(ds); lastDataSource = ds;
                ds.entities.values.forEach(ent=>{ if(ent.polygon){ ent.polygon.material = Cesium.Color.BLUE.withAlpha(0.5); ent.polygon.outline=true; ent.polygon.outlineColor=Cesium.Color.BLACK; }});
            }).catch(()=>{});
        }

        // pick position helpers
        function getCartesianFromDomEvent(e){ const rect = document.getElementById('cesiumContainer').getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; const windowPosition = new Cesium.Cartesian2(x,y); let cart = null; try{ if(viewer.scene.pickPositionSupported) cart = viewer.scene.pickPosition(windowPosition); }catch(e){ cart = null; } if(!cart) cart = viewer.camera.pickEllipsoid(windowPosition, viewer.scene.globe.ellipsoid); return cart; }
        function findNearestPointEntity(cartesian){ if(!cartesian) return null; const ents = viewer.entities.values; let best=null, bestDist=Infinity; const now=Cesium.JulianDate.now(); for(let i=0;i<ents.length;i++){ const ent=ents[i]; if(!ent.provinceName || !ent.position) continue; const pos=ent.position.getValue(now); if(!pos) continue; const d = Cesium.Cartesian3.distance(pos,cartesian); if(d<bestDist){ bestDist=d; best={entity:ent, distance:d}; }} return best; }

        // drag/drop on globe
        const cesiumContainer = document.getElementById('cesiumContainer');
        cesiumContainer.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
        cesiumContainer.addEventListener('drop', e=>{
            e.preventDefault(); const provinceId = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text');
            console.log('[drop] dataTransfer:', provinceId);
            if(!provinceId) return; const cart = getCartesianFromDomEvent(e); if(!cart){ alert('Impossible de déterminer l\'endroit sur le globe.'); return; } const nearest = findNearestPointEntity(cart);
            console.log('[drop] nearest:', nearest && nearest.entity && nearest.entity.provinceName, 'dist:', nearest && nearest.distance);
            if(!nearest || !nearest.entity){ alert('Aucun point proche trouvé.'); return; }
             if(nearest.entity.provinceName === provinceId){
                 // read displayName/country then place and register
                 fetch(`./states/${provinceId}.json`).then(r=>{ if(!r.ok) throw new Error('fetch'); return r.json(); }).then(json=>{
                    const feat = (json.features && json.features[0])||null; const displayName = feat && (feat.properties.Name_1 || feat.properties.Country) ? (feat.properties.Name_1 || feat.properties.Country) : provinceId; const country = feat && feat.properties && feat.properties.Country ? feat.properties.Country : null;
                    displayProvinceOnGlobe(nearest.entity.featureGeometry);
                    try{ viewer.entities.remove(nearest.entity); }catch(e){}
                    registerPlacedProvince(provinceId, displayName, country);
                    loadRandomProvince();
                }).catch(()=>{ displayProvinceOnGlobe(nearest.entity.featureGeometry); try{ viewer.entities.remove(nearest.entity); }catch(e){} registerPlacedProvince(provinceId, provinceId, null); loadRandomProvince(); });
            } else { alert('Ce n\'est pas le bon endroit.'); }
        });

        // click handler: points stay white; polygons show infoBox
        let selectedEntity = null;
        try{
            if(viewer && viewer.scene && viewer.scene.canvas){
                const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
                handler.setInputAction(function(click){
                     try{
                        // Save camera state to restore it after possible internal camera changes
                        let camState = null;
                        try {
                            const cam = viewer.camera;
                            camState = {
                                position: cam.position.clone(),
                                direction: cam.direction.clone(),
                                up: cam.up.clone()
                            };
                        } catch (e) { camState = null; }

                        const picked = viewer.scene.pick(click.position);
                        if (Cesium.defined(picked) && picked.id) {
                            const ent = picked.id;
                            if (ent.polygon) {
                                try {
                                    const title = ent.name || (ent.properties && ent.properties.Name_1) || 'Province';
                                    let desc = '';
                                    if (ent.properties) {
                                        desc += '<table style="border-collapse:collapse; width:100%">';
                                        for (const k in ent.properties) {
                                            if (!Object.prototype.hasOwnProperty.call(ent.properties, k)) continue;
                                            const v = ent.properties[k];
                                            desc += `<tr><td style="border:1px solid #ddd;padding:4px;font-weight:600">${k}</td><td style="border:1px solid #ddd;padding:4px">${v}</td></tr>`;
                                        }
                                        desc += '</table>';
                                    }
                                    if (viewer.infoBox && viewer.infoBox.viewModel) {
                                        viewer.infoBox.viewModel.title = title;
                                        viewer.infoBox.viewModel.description = desc || 'Aucune donnée disponible.';
                                        if (viewer.infoBox.container) viewer.infoBox.container.style.display = '';
                                    }
                                } catch (e) { /* ignore */ }
                            } else {
                                try { if (viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display = 'none'; } catch (e) {}
                            }
                        }

                        // Restore camera state shortly after to cancel any internal camera movement
                        if (camState) {
                            setTimeout(() => {
                                try {
                                    viewer.camera.setView({
                                        destination: camState.position,
                                        orientation: {
                                            direction: camState.direction,
                                            up: camState.up
                                        }
                                    });
                                } catch (e) { /* ignore restore errors */ }
                            }, 20);
                        }
                     }catch(e){}
                 }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
            }
        }catch(e){}

        // Skip button
        if(skipSidebar){ skipSidebar.addEventListener('click', e=>{ e.preventDefault(); selectedEntity=null; const next = pickDifferentProvince() || getRandomProvince(); if(!next) return; skipSidebar.disabled=true; loadProvinceByName(next).finally(()=>{ skipSidebar.disabled=false; }); }); }

        // burger toggle
        if(burgerButton){ burgerButton.addEventListener('click', ()=>{ if(!placedPanel) return; placedPanel.style.display = placedPanel.style.display==='block'?'none':'block'; }); }

    </script>
</body>
</html>
