    <style>
        html,
        body {
            min-height: 100vh;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
        }

        #sidebar {
            /* responsive sidebar with min/max using clamp */
            width: clamp(220px, 20%, 420px);
            background: #f4f4f4;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative; /* ensure absolutely positioned footer sits inside sidebar */
            z-index: 9999;
        }

        #sidebarContent {
            flex: 1 1 auto;
            overflow-y: auto;
            /* keep space for the bottom button so it's not overlapped */
            padding-bottom: 12px;
            min-height: 0; /* allow flex child to shrink and enable scrolling */
        }

        /* footer inside sidebar placed by flex; margin-top:auto pushes it to the bottom */
        #sidebarBottom {
            position: relative;
            margin-top: auto;
            background: #fff;
            padding: 8px 0 8px 0;
            border-top: 1px solid #e0e0e0;
            left: 0;
            right: 0;
            z-index: 50; /* ensure visible above tiles */
        }
        /* Make the Skip button non-selectable to avoid interfering with drag gestures */
        #sidebarBottom button {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        /* Prevent selection on tile/title/svg wrapper to avoid blocking drag */
        .tile, .tileTitle, .svg-wrapper, #sidebarContent {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }


        #placedPanel {
            display: none;
            margin-top: 8px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e0e0e0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #burgerButton {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .tile {
            margin: 10px 0;
            padding: 6px;
            background: #fff;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .tileTitle {
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 8px;
            color: #222;
            cursor: grab;
        }

        /* SVG wrapper ensures square SVG */
        .svg-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; /* force square when supported */
            /* fallback for browsers that don't support aspect-ratio: use padding-top trick */
            position: relative;
            display: block;
            overflow: hidden;
            background: #fff;
            box-sizing: border-box;
        }

        /* create a padding-based square fallback using a pseudo-element */
        .svg-wrapper::before {
            content: '';
            display: block;
            padding-top: 100%; /* keep a square aspect by default */
            /* only used when aspect-ratio is not honored; when aspect-ratio is supported this has no visual effect */
        }

        /* place the SVG absolutely inside the square so it always fills the available square area */
        .svg-wrapper svg {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            width: calc(100% - 12px);
            height: calc(100% - 12px);
            max-width: none;
            max-height: none;
            display: block;
            cursor: grab; /* indicate draggable */
        }

        .svg-wrapper svg:active {
            cursor: grabbing;
        }

        .tileLabel {
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            color: #222;
        }

        #cesiumContainer {
            flex: 1 1 auto;
            /* don't use fixed viewport height here; let flexbox distribute space */
            position: relative;
            min-width: 0; /* allow flex children to shrink properly */
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* More specific rules to force the Cesium widget to grow inside the flex container */
        #cesiumContainer > .cesium-viewer,
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport,
        #cesiumContainer > .cesium-viewer, #cesiumContainer > .cesium-viewer .cesium-widget, #cesiumContainer canvas {
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            flex: 1 1 auto;
        }
        /* ensure the direct viewer element grows to fill the parent */
        #cesiumContainer > .cesium-viewer { display: flex; flex-direction: column; }
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport { flex: 1 1 auto; }

        /* hide default Cesium UI elements we don't want */
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-bottom,
        .cesium-viewer-fullscreenContainer,
        .cesium-button,
        .cesium-navigationHelpButton-wrapper {
            display: none !important;
        }

        /* floating placement button */
        #placeButton {
            position: absolute;
            z-index: 10000;
            display: none;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Notifications */
        #notifications {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20000;
            pointer-events: none; /* allow clicks through container except on notifications */
        }
        .notif {
            min-width: 220px;
            max-width: 380px;
            padding: 10px 14px;
            color: #fff;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            font-weight: 600;
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 220ms ease, transform 220ms ease;
        }
        .notif.hide { opacity: 0; transform: translateY(-8px); }
        .notif.success { background: #2ecc71; }
        .notif.error { background: #e74c3c; }
        .notif.warn { background: #f39c12; }

        /* flag images sized to font-size */
        .flag {
            height: 1em; /* same height as current font */
            width: auto;
            margin-right: 8px;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            background: #fff;
        }

        /* Progress bar in the sidebar (compact, CodePen-like style) */
        .progress-wrap {
            width: calc(100% - 16px);
            margin: 6px 8px;
            padding: 6px;
            box-sizing: border-box;
            background: linear-gradient(180deg, #f5f5f5, #ffffff);
            border-radius: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .progress-track {
            flex:1 1 auto;
            height:10px;
            background: #e9ecef;
            border-radius: 999px;
            overflow:hidden;
            position:relative;
        }
        .progress-fill {
            height:100%;
            width:0%;
            background: linear-gradient(90deg,#4ade80,#10b981); /* green gradient */
            transition: width 500ms ease;
            box-shadow: inset 0 -2px 6px rgba(0,0,0,0.08);
        }
        .progress-text {
            min-width:44px;
            text-align:right;
            font-weight:700;
            font-size:13px;
            color:#222;
        }

    </style>
    <title>Giant Globe Puzzle</title>
</head>

    <script type="module">

        // Disable infoBox and selectionIndicator (Cesium creates a sandboxed iframe for the InfoBox)

        // list of files (trimmed) - kept as in your workspace
        const file_list = [
            "Afghanistan","AkrotiriandDhekelia","Åland","Albania","Algeria","AmericanSamoa","Andorra","Angola","Anguilla","AntiguaandBarbuda","Argentina","Armenia","Aruba","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bermuda","Bhutan","Bolivia","BonaireSintEustatiusandSaba","BosniaandHerzegovina","Botswana","BouvetIsland","Brazil","BritishIndianOceanTerritory","BritishVirginIslands","Brunei","Bulgaria","BurkinaFaso","Burundi","CaboVerde","Cambodia","Cameroon","Canada","CaymanIslands","CentralAfricanRepublic","Chad","Chile","China","ChristmasIsland","ClippertonIsland","CocosIslands","Colombia","Comoros","CookIslands","CostaRica","CôtedIvoire","Croatia","Cuba","Curaçao","Cyprus","Czechia","DemocraticRepublicoftheCongo","Denmark","Djibouti","Dominica","DominicanRepublic","Ecuador","Egypt","ElSalvador","EquatorialGuinea","Eritrea","Estonia","Eswatini","Ethiopia","FalklandIslands","FaroeIslands","Fiji","Finland","France","FrenchGuiana","FrenchPolynesia","FrenchSouthernTerritories","Gabon","Gambia","Georgia","Germany","Ghana","Gibraltar","Greece","Greenland","Grenada","Guadeloupe","Guam","Guatemala","Guernsey","Guinea-Bissau","Guinea","Guyana","Haiti","HeardIslandandMcDonaldIsland","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","IsleofMan","Israel","Italy","Jamaica","Japan","Jersey","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","MarshallIslands","Martinique","Mauritania","Mauritius","Mayotte","México","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Montserrat","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","NewCaledonia","NewZealand","Nicaragua","Niger","Nigeria","Niue","NorfolkIsland","NorthKorea","NorthernCyprus","NorthMacedonia","NorthernMarianaIslands","Norway","Oman","Pakistan","Palau","Palestine","Panama","PapuaNewGuinea","ParacelIslands","Paraguay","Peru","Philippines","PitcairnIslands","Poland","Portugal","PuertoRico","Qatar","Réunion","Romania","Russia","Rwanda","Saint-Barthélemy","Saint-Martin","SaintHelena,AscensionandTristandaCunha","SaintKittsandNevis","SaintLucia","SaintPierreandMiquelon","SaintVincentandtheGrenadines","Samoa","SanMarino","SãoToméandPríncipe","SaudiArabia","Senegal","Serbia","Seychelles","SierraLeone","Singapore","SintMaarten","Slovakia","Slovenia","SolomonIslands","Somalia","SouthAfrica","SouthGeorgiaandtheSouthSandwichIslands","SouthKorea","SouthSudan","Spain","SpratlyIslands","SriLanka","Sudan","Suriname","SvalbardandJanMayen","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Togo","Tokelau","Tonga","TrinidadandTobago","Tunisia","Turkey","Turkmenistan","TurksandCaicosIslands","Tuvalu","Uganda","Ukraine","UnitedArabEmirates","UnitedKingdom","UnitedStates","UnitedStatesMinorOutlyingIslands","Uruguay","Uzbekistan","Vanuatu","Vatican","Venezuela","Vietnam","VirginIslands,US","WallisandFutuna","WesternSahara","Yemen","Zambia","Zimbabwe","RepublicoftheCongo","Timor-Leste"
        ];

        const sidebarContent = document.getElementById('sidebarContent');
        const skipSidebar = document.getElementById('skipSidebar');
        const burgerButton = document.getElementById('burgerButton');
        const placedPanel = document.getElementById('placedPanel');
        const placeButton = document.getElementById('placeButton');
        const notifications = document.getElementById('notifications');

        function showNotification(message, type = 'success', ttl = 3500) {
            try {
                if (!notifications) return;
                const n = document.createElement('div');
                n.className = 'notif ' + (type || 'success');
                n.innerHTML = message;
                notifications.appendChild(n);
                setTimeout(() => { n.classList.add('hide'); setTimeout(() => { try { notifications.removeChild(n); } catch (e) {} }, 260); }, ttl);
            } catch (e) { /* ignore */ }
        }

        // Global error capture to help debugging runtime issues in the browser.
        try {
            window.addEventListener('error', function (evt) {
                try { showNotification('Runtime error: ' + (evt && evt.message ? evt.message : String(evt)), 'error', 8000); } catch (e) {}
                // also log to console
                console.error('Captured error:', evt.error || evt.message || evt);
            });
            window.addEventListener('unhandledrejection', function (evt) {
                try { showNotification('Unhandled promise rejection: ' + (evt && evt.reason ? (evt.reason.message || String(evt.reason)) : String(evt)), 'error', 8000); } catch (e) {}
                console.error('Unhandled rejection:', evt.reason || evt);
            });
        } catch (e) { /* ignore */ }

        // state
        let currentDisplayedProvince = null;
        let currentDisplayedProvinceKey = null; // unique key provinceName::featureIndex for the tile shown
        let currentDisplayedFeatureCentroid = null; // centroid string 'lon,lat' of the feature shown in sidebar
        let currentIndex = -1;
        let placedProvinces = []; // { name, displayName, country }
        const placedDataSources = []; // keep all placed GeoJsonDataSource objects so they remain visible
        let lastDataSource = null;
        let selectedPointEntity = null; // for click-to-place flow
        let placedFeaturesCount = 0; // total count of placed feature-tiles
        // total number of province-tiles (features) across all state files
        let totalProvincesCount = 0;
        // map filename -> number of features in that file (used for country->features selection)
        const countryFeatureCounts = {};
        // attempts per feature key (provinceName::featureIndex)
        const attemptsByKey = {};
        // total score
        let totalScore = 0;

        // updatePlacedPanel defined early to avoid ReferenceError when other functions call it
        function updatePlacedPanel(){
            try{
                if(typeof placedPanel === 'undefined' || !placedPanel) return;
                placedPanel.innerHTML = '';
                const groups = {};
                placedProvinces.forEach(p => { const k = p.country || 'Unknown'; (groups[k] = groups[k] || []).push(p); });
                const countryKeys = Object.keys(groups).sort((a,b)=> a.localeCompare(b, 'en', { sensitivity: 'base' }));
                countryKeys.forEach(country => {
                    const items = (groups[country]||[]).slice().sort((x,y)=> ( (x.displayName||x.name||'').toString().localeCompare((y.displayName||y.name||'').toString(), 'en', { sensitivity: 'base' }) ));
                    let groupFlag = null; for(const it of items){ if(it && it.flag) { groupFlag = it.flag; break; } }
                    const flagUrl = groupFlag || (country ? makeFlagUrl(country) : null);
                    const header = document.createElement('div'); header.style.display='flex'; header.style.alignItems='center'; header.style.gap='8px'; header.style.marginTop='6px';
                    if(flagUrl){ const img = document.createElement('img'); img.className='flag'; img.alt=`${country} flag`; img.src=flagUrl; img.onerror=()=>{ try{ img.style.display='none'; }catch(e){} }; header.appendChild(img); }
                    const h = document.createElement('a'); h.dataset.wikiName = country; h.href = makeWikiUrl(country); h.target = '_blank'; h.rel='noopener noreferrer'; h.style.fontWeight='bold'; h.style.color='inherit'; h.style.textDecoration='none'; h.textContent = country; h.addEventListener('click', ev=> ev.stopPropagation()); header.appendChild(h);
                    placedPanel.appendChild(header);
                    const ul = document.createElement('ul'); ul.style.paddingLeft='16px';
                    items.forEach(p=>{
                        const li = document.createElement('li'); li.style.cursor='pointer';
                        const pname = p.displayName || p.name || '';
                        const a = document.createElement('a'); a.dataset.wikiName = pname; a.href = makeWikiUrl(pname); a.target='_blank'; a.rel='noopener noreferrer'; a.textContent = pname; a.style.color='inherit'; a.style.textDecoration='none'; a.addEventListener('click', ev=> ev.stopPropagation());
                        li.appendChild(a);
                        li.addEventListener('click', ()=>{ try{ viewer.dataSources._dataSources.forEach(ds => ds.entities.values.forEach(ent => { if((ent.name===pname) || (ent.properties && ent.properties.Name_1===pname)) { viewer.flyTo(ent).catch(()=>{}); } })); }catch(e){} });
                        ul.appendChild(li);
                    });
                    placedPanel.appendChild(ul);
                });
                // wiki link updater removed; links use makeWikiUrl() directly
            }catch(e){ /* ignore */ }
        }

        function updateScoreDisplay(){
            try{
                const el = document.getElementById('scoreDisplay');
                if(el) el.textContent = `Score: ${totalScore}`;
            }catch(e){}
        }

        function isPlaced(name) { return placedProvinces.some(p => p.name === name); }
        // check if a specific province featureKey is already placed
        function isPlacedKey(key) { return placedProvinces.some(p => p.key === key); }
        // registerPlacedProvince(name, displayName, country, flag, key)
        function registerPlacedProvince(name, displayName, country) {
            const flag = (arguments.length >= 4) ? arguments[3] : null;
            const key = (arguments.length >= 5) ? arguments[4] : null;
            // if key provided, avoid duplicate per key; otherwise fallback to name-based check
            if (key) {
                if (isPlacedKey(key)) return;
            } else {
                if (isPlaced(name)) return;
            }
            const entry = { name, displayName, country, flag };
            if (key) entry.key = key;
            placedProvinces.push(entry);
            // increment placed features counter only once per unique placed feature
            placedFeaturesCount += 1;
            updatePlacedPanel();
            updateProgress();
        }

        // update the progress bar (placed provinces vs total tiles)
        function updateProgress(){
            try{
                const total = (typeof totalProvincesCount === 'number' && totalProvincesCount>0) ? totalProvincesCount : 0;
                const placed = (typeof placedFeaturesCount === 'number') ? placedFeaturesCount : 0;
                const pct = (total > 0) ? Math.round((placed / total) * 100) : 0;
                const fill = document.getElementById('progressFill');
                const txt = document.getElementById('progressText');
                if (fill) { fill.style.width = (total>0? (placed/total*100) : 0) + '%'; if (fill.parentElement) fill.parentElement.setAttribute('aria-valuenow', String(pct)); }
                if (txt) txt.textContent = `${placed} / ${total}`;
            }catch(e){/*ignore*/}
        }

        // Affiche le drapeau dans la tuile (sidebar) seulement si le nombre d'essais pour la clé >= 5
        function refreshDisplayedTileFlag(key) {
            try {
                const k = key || currentDisplayedProvinceKey;
                if (!k) return;
                const tile = document.querySelector('#sidebarContent .tile');
                if (!tile) return;
                const img = tile.querySelector('img.flag');
                if (!img) return;
                const flagUrl = tile.dataset.flagUrl || img.dataset.flagUrl || null;
                const attempts = attemptsByKey[k] || 0;
                if (attempts >= 5 && flagUrl) {
                    // show and ensure src is set
                    if (!img.getAttribute('src') || img.getAttribute('src') !== flagUrl) {
                        img.src = flagUrl;
                    }
                    img.style.display = '';
                } else {
                    // hide flag until threshold
                    img.style.display = 'none';
                    // optionally avoid loading image until needed
                    try { img.removeAttribute('src'); } catch(e) {}
                }
            } catch (e) { /* ignore */ }
        }

        // initialize progress at startup
        try{ window.addEventListener('load', ()=>{ setTimeout(()=>{ updateProgress(); }, 50); }); }catch(e){}
        // Display a GeoJSON geometry on the Cesium globe
        function displayProvinceOnGlobe(geometry, opts = {}) {
            try {
                if (!geometry) return;
                const feature = { type: 'Feature', geometry: geometry, properties: opts.properties || {} };
                const geojson = { type: 'FeatureCollection', features: [feature] };
                const loadOptions = Object.assign({ clampToGround: false }, opts.loadOptions || {});
                Cesium.GeoJsonDataSource.load(geojson, loadOptions).then(ds => {
                    try {
                        viewer.dataSources.add(ds);
                        placedDataSources.push(ds);
                        // style entities if needed
                        try {
                            ds.entities.values.forEach(ent => {
                                if (ent.polygon) {
                                    ent.polygon.material = opts.fillColor || Cesium.Color.fromBytes(60,159,255,0.6);
                                    ent.polygon.outline = true;
                                    ent.polygon.outlineColor = opts.outlineColor || Cesium.Color.BLACK;
                                }
                                if (ent.properties) {
                                    // set a provinceKey if provided
                                    if (opts.provinceKey) ent.provinceKey = opts.provinceKey;
                                }
                            });
                        } catch (e) { /* ignore styling errors */ }
                        // keep the globe visible for all placed provinces (do not auto-zoom unless asked)
                        if (opts.flyTo) { try { viewer.flyTo(ds).catch(()=>{}); } catch(e){} }
                    } catch (e) { console.error('displayProvinceOnGlobe add error', e); }
                }).catch(err => {
                    console.error('displayProvinceOnGlobe load error', err);
                });
            } catch (e) { console.error('displayProvinceOnGlobe error', e); }
        }

        async function applyImportedObject(obj){
            if(!obj || !obj.placedProvinces) { showNotification('Invalid file.', 'error'); return; }
            try{
                // replace local arrays
                placedProvinces.length = 0; placedProvinces.push(...obj.placedProvinces);
                for(const k in attemptsByKey) delete attemptsByKey[k];
                Object.assign(attemptsByKey, obj.attemptsByKey || {});
                totalScore = Number(obj.totalScore) || 0;
                placedFeaturesCount = Number(obj.placedFeaturesCount) || placedProvinces.length;
                updateScoreDisplay(); updatePlacedPanel(); updateProgress();

                // remove any existing placed polygons / points that correspond to these placed keys, then show polygons
                // first remove matching point entities so they don't remain
                try{
                    const now = Cesium.JulianDate.now();
                    const ents = viewer.entities.values.slice();
                    for(const ent of ents){ if(ent && ent.provinceKey && isPlacedKey(ent.provinceKey)){ try{ viewer.entities.remove(ent); }catch(e){} } }
                }catch(e){}

                // load polygons for each placed province entry
                for(const p of placedProvinces){
                    try{
                        const name = p.name;
                        const key = p.key || null;
                        if(!name) continue;
                        // if key available, try to fetch specific feature
                        if(key && key.includes('::')){
                            const parts = key.split('::'); const fname = parts[0]; const idx = parseInt(parts[1]||'0',10) || 0;
                            try{
                                const r = await fetch(`./states/${fname}.json`);
                                if(!r.ok) continue;
                                const j = await r.json(); const feat = (j.features && j.features[idx])? j.features[idx] : null;
                                if(feat && feat.geometry) displayProvinceOnGlobe(feat.geometry);
                            }catch(e){ /* ignore per-file errors */ }
                        } else {
                            // fallback: try to load first feature of the file
                            try{
                                const r = await fetch(`./states/${name}.json`);
                                if(!r.ok) continue; const j = await r.json(); const feat = (j.features && j.features[0])? j.features[0] : null; if(feat && feat.geometry) displayProvinceOnGlobe(feat.geometry);
                            }catch(e){}
                        }
                    }catch(e){}
                }

                showNotification('Save imported successfully.', 'success');
            }catch(e){ showNotification('Error during import.', 'error'); }
        }

        // Build a likely Wikipedia commons file path for the country's flag (unchanged behavior)
        function makeFlagUrl(countryName) {
            if (!countryName) return null;
            let clean = countryName.replace(/[\u2019'‘’.,]/g, '').replace(/\s+/g, '_').replace(/&/g, 'and').replace(/,+$/,'');
            const filename = `Flag_of_${clean}.svg`;
            return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}`;
        }

        // Simple Wikipedia URL helper (English only)
        function makeWikiUrl(name) {
            if (!name) return 'https://en.wikipedia.org/';
            let s = String(name).trim();
            s = s.replace(/,\s*$/,'').replace(/\s*\(.+\)$/, '');
            s = s.replace(/[\/]/g, '_').replace(/\s+/g, '_');
            return `https://en.wikipedia.org/wiki/${encodeURIComponent(s)}`;
        }

        // Save / Load logic
        const saveBtn = document.getElementById('saveBtn');
        const savePanel = document.getElementById('savePanel');
        const closeSavePanel = document.getElementById('closeSavePanel');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFile = document.getElementById('importFile');
        const importArea = document.getElementById('importArea');
        const validateImportBtn = document.getElementById('validateImport');

        function getSaveObject(){
            return {
                placedProvinces: placedProvinces.slice(),
                attemptsByKey: Object.assign({}, attemptsByKey),
                totalScore: totalScore || 0,
                placedFeaturesCount: placedFeaturesCount || 0,
                totalProvincesCount: totalProvincesCount || 0
            };
        }

        function exportProgress(){
            try{
                const obj = getSaveObject();
                const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'puzzle_globe_save.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); try{ document.body.removeChild(a); }catch(e){} }, 500);
            }catch(e){ showNotification('Error during export.', 'error'); }
        }

        // UI wiring
        if(saveBtn) saveBtn.addEventListener('click', ()=>{ savePanel.style.display = savePanel.style.display === 'block' ? 'none' : 'block'; });
        if(closeSavePanel) closeSavePanel.addEventListener('click', ()=>{ savePanel.style.display='none'; });
        if(exportBtn) exportBtn.addEventListener('click', exportProgress);
        if(importBtn) importBtn.addEventListener('click', ()=> importFile.click());
        if(importFile) importFile.addEventListener('change', (ev)=>{ const f = ev.target.files && ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (e)=>{ try{ const parsed = JSON.parse(e.target.result); applyImportedObject(parsed); }catch(ex){ showNotification('Invalid JSON file.', 'error'); } }; r.readAsText(f); });
        if(validateImportBtn) validateImportBtn.addEventListener('click', ()=>{ const txt = importArea.value && importArea.value.trim(); if(!txt){ showNotification('Paste a valid JSON.', 'error'); return; } try{ const parsed = JSON.parse(txt); applyImportedObject(parsed); }catch(e){ showNotification('Invalid JSON.', 'error'); } });
    </script>
</body>
</html>
