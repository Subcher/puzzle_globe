    const sidebar = document.getElementById('sidebar');
    let lastSelectedProvince = null;
    let lastDataSource = null;

    // Function to select a random province without repetition
    function getRandomProvince() {
        if (file_list.length === 0) {
            console.error("No provinces available.");
            return null;
        }

        let randomProvince;
        do {
            const randomIndex = Math.floor(Math.random() * file_list.length);
            randomProvince = file_list[randomIndex];
        } while (randomProvince === lastSelectedProvince && file_list.length > 1);

        lastSelectedProvince = randomProvince;
        return randomProvince;
    }

    // Function to create an SVG path from GeoJSON geometry and fit it to the SVG
    function createSVGPath(geometry, svgWidth, svgHeight) {
        if (geometry.type !== 'Polygon' && geometry.type !== 'MultiPolygon') {
            console.error('Unsupported geometry type:', geometry.type);
            return '';
        }

        // Calculate bounding box of the geometry
        const bbox = turf.bbox(geometry); // [xmin, ymin, xmax, ymax]
        const [xmin, ymin, xmax, ymax] = bbox;

        // Calculate scaling factors to fit the geometry into the SVG
        const scaleX = svgWidth / (xmax - xmin);
        const scaleY = svgHeight / (ymax - ymin);
        const scale = Math.min(scaleX, scaleY); // Maintain aspect ratio

        // Transform coordinates to fit within the SVG
        const coordinates = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
        let path = '';

        coordinates.forEach(polygon => {
            polygon.forEach(ring => {
                const projected = ring.map(([lon, lat]) => {
                    const x = (lon - xmin) * scale; // Scale and translate X
                    const y = svgHeight - (lat - ymin) * scale; // Scale and translate Y (invert Y-axis)
                    return `${x},${y}`;
                });

                path += `M${projected.join('L')}Z `;
            });
        });

        return path.trim();
    }

    // Function to add a point to the globe at the center of a feature
    function addPointToGlobe(provinceName, geometry) {
        const center = turf.center(geometry); // Calculate the center of the feature
        const [lon, lat] = center.geometry.coordinates;

        const entity = viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(lon, lat),
            point: {
                pixelSize: 8,
                color: Cesium.Color.WHITE,
            },
        });

        // Store metadata on the entity so we can identify it when clicked
        entity.provinceName = provinceName;
        entity.featureGeometry = geometry;
    }

    // Function to load all features from all provinces and display their points on the globe
    async function loadAllFeatures() {
        for (const provinceName of file_list) {
            const filePath = `./states/${provinceName}.json`;
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    console.error(`Error loading ${filePath}: ${response.statusText}`);
                    continue;
                }

                const geoJson = await response.json();
                if (geoJson.features && Array.isArray(geoJson.features)) {
                    geoJson.features.forEach(feature => {
                        // Pass province name and full feature geometry so we can display later
                        addPointToGlobe(provinceName, feature.geometry);
                    });
                }
            } catch (error) {
                console.error(`Error reading file ${filePath}:`, error);
            }
        }
    }

    // Load all features at the start
    loadAllFeatures();

    // Update the loadRandomProvince function to use the new createSVGPath
    async function loadRandomProvince() {
        const provinceName = getRandomProvince();
        if (!provinceName) return;

        const filePath = `./states/${provinceName}.json`;
        try {
            const response = await fetch(filePath);
            if (!response.ok) {
                console.error(`Error loading ${filePath}: ${response.statusText}`);
                return;
            }

            const geoJson = await response.json();
            if (geoJson.features && geoJson.features.length > 0) {
                const properties = geoJson.features[0].properties;
                const geometry = geoJson.features[0].geometry;
                const displayName = properties.Name_1 || properties.Country || provinceName;

                // Create tile
                const tile = document.createElement('div');
                tile.className = 'tile';
                // tiles are not draggable anymore; interaction is by clicking globe points
                // tile.draggable = true;
                tile.dataset.id = provinceName;
                tile.textContent = displayName;

                // Create SVG for the shape
                const svgWidth = 300; // Width of the SVG
                const svgHeight = 150; // Height of the SVG
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '150px');
                svg.style.border = '1px solid #ddd';

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', createSVGPath(geometry, svgWidth, svgHeight));
                path.setAttribute('fill', 'rgba(0, 123, 255, 0.5)');
                path.setAttribute('stroke', '#007bff');
                path.setAttribute('stroke-width', '1');
                svg.appendChild(path);

                // Append tile and SVG to the sidebar
                sidebar.innerHTML = ''; // Clear previous content
                sidebar.appendChild(tile);
                sidebar.appendChild(svg);

                // No drag events: user will click a point on the globe and press "Placer"
            }
        } catch (error) {
            console.error(`Error reading file ${filePath}:`, error);
        }
    }

    // Load the first random province
    loadRandomProvince();

    function displayProvinceOnGlobe(inputGeometry) {
        // Sanitize geometry: remove invalid coordinates and tiny rings/polygons to avoid NaN errors in Cesium
        function isValidNumber(n) {
            return typeof n === 'number' && Number.isFinite(n);
        }

        function sanitizePolygonCoords(coords) {
            // coords: array of rings; each ring: array of [lon, lat, ...]
            const outRings = [];
            for (const ring of coords) {
                // Map and filter invalid numbers, clamp to valid ranges, and remove consecutive duplicates
                const mapped = ring.map(pt => {
                    const lon = Number(pt[0]);
                    const lat = Number(pt[1]);
                    if (!isValidNumber(lon) || !isValidNumber(lat)) return null;
                    // filter by valid geographic ranges
                    if (lon < -180 || lon > 180 || lat < -90 || lat > 90) return null;
                    return [lon, lat];
                }).filter(Boolean);

                const cleanRing = [];
                for (let i = 0; i < mapped.length; i++) {
                    const pt = mapped[i];
                    const prev = cleanRing[cleanRing.length - 1];
                    if (!prev || prev[0] !== pt[0] || prev[1] !== pt[1]) {
                        cleanRing.push(pt);
                    }
                }

                // Ensure ring closes (first == last); GeoJSON allows non-closed rings but Cesium ok with either
                if (cleanRing.length >= 3) {
                    // if not closed, close it
                    const first = cleanRing[0];
                    const last = cleanRing[cleanRing.length - 1];
                    if (first[0] !== last[0] || first[1] !== last[1]) {
                        cleanRing.push([first[0], first[1]]);
                    }
                    outRings.push(cleanRing);
                }
            }
            return outRings.length ? outRings : null;
        }

        try {
            const geom = (inputGeometry && inputGeometry.type === 'Feature') ? inputGeometry.geometry : inputGeometry;
            if (!geom || !geom.type) {
                console.error('No geometry to display', geom);
                return;
            }

            let sanitized = null;
            if (geom.type === 'Polygon') {
                const rings = sanitizePolygonCoords(geom.coordinates);
                // small polygon check: ensure bbox is not degenerate
                if (rings) {
                    const flat = rings.flat();
                    const lons = flat.map(p => p[0]);
                    const lats = flat.map(p => p[1]);
                    const lonRange = Math.max(...lons) - Math.min(...lons);
                    const latRange = Math.max(...lats) - Math.min(...lats);
                    if (lonRange > 1e-6 && latRange > 1e-6) sanitized = { type: 'Polygon', coordinates: rings };
                    else console.warn('Skipping tiny/degenerate polygon');
                }
            } else if (geom.type === 'MultiPolygon') {
                const polys = [];
                for (const poly of geom.coordinates) {
                    const rings = sanitizePolygonCoords(poly);
                    if (rings) {
                        const flat = rings.flat();
                        const lons = flat.map(p => p[0]);
                        const lats = flat.map(p => p[1]);
                        const lonRange = Math.max(...lons) - Math.min(...lons);
                        const latRange = Math.max(...lats) - Math.min(...lats);
                        if (lonRange > 1e-6 && latRange > 1e-6) polys.push(rings);
                        else console.warn('Skipping tiny/degenerate polygon in MultiPolygon');
                    }
                }
                if (polys.length) sanitized = { type: 'MultiPolygon', coordinates: polys };
            } else {
                // For other types, pass through (GeoJsonDataSource may handle)
                sanitized = geom;
            }

            if (!sanitized) {
                console.error('Sanitized geometry is empty or invalid, skipping display. Original:', geom);
                return;
            }

            const feature = {
                type: 'Feature',
                geometry: sanitized,
                properties: {}
            };

            Cesium.GeoJsonDataSource.load(feature, { clampToGround: false }).then(dataSource => {
                // Remove previously displayed province to keep only one at a time
                if (lastDataSource) {
                    try { viewer.dataSources.remove(lastDataSource, true); } catch (e) { /* ignore */ }
                    lastDataSource = null;
                }
                viewer.dataSources.add(dataSource);
                lastDataSource = dataSource;

                dataSource.entities.values.forEach(entity => {
                    if (entity.polygon) {
                        entity.polygon.material = Cesium.Color.BLUE.withAlpha(0.5);
                        entity.polygon.outline = true;
                        entity.polygon.outlineColor = Cesium.Color.BLACK;
                    }
                });
                viewer.flyTo(dataSource).catch(() => {});
            }).catch(err => {
                console.error('GeoJsonDataSource.load failed:', err);
            });
        } catch (err) {
            console.error('displayProvinceOnGlobe unexpected error:', err);
        }
    }

    // Drag-and-drop logic
    // removed drag-and-drop: interaction is now by clicking points

    const cesiumContainer = document.getElementById('cesiumContainer');

    // Remove existing drag/drop behavior on Cesium container (we'll use clicks now)
    // Allow clicking points: show a "Placer" button when a point is clicked
    const placePanel = document.getElementById('placePanel');
    const placeButton = document.getElementById('placeButton');
    const cancelPlace = document.getElementById('cancelPlace');
    const placeInfo = document.getElementById('placeInfo');

    let selectedEntity = null; // entity clicked on the globe

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction(function (movement) {
        const picked = viewer.scene.pick(movement.position);
        if (Cesium.defined(picked) && picked.id && picked.id.provinceName) {
            selectedEntity = picked.id;
            placeInfo.textContent = `Point sélectionné: ${selectedEntity.provinceName}`;
            placePanel.style.display = 'block';

            // Visual feedback: make the selected point yellow
            if (selectedEntity.point) {
                selectedEntity._originalColor = selectedEntity.point.color;
                selectedEntity.point.color = Cesium.Color.YELLOW;
            }
        } else {
            // click sur autre chose : masquer le panneau
            selectedEntity = null;
            placePanel.style.display = 'none';
        }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // Cancel
    cancelPlace.addEventListener('click', () => {
        if (selectedEntity && selectedEntity.point && selectedEntity._originalColor) {
            selectedEntity.point.color = selectedEntity._originalColor;
        }
        selectedEntity = null;
        placePanel.style.display = 'none';
    });

    // Place button behaviour: check if selected point matches the currently displayed province
    placeButton.addEventListener('click', () => {
        if (!selectedEntity) return;

        const clickedProvince = selectedEntity.provinceName;
        // Compare directly with the last selected province
        if (clickedProvince === lastSelectedProvince) {
            // Correct: display the province geometry on the globe and load the next province
            displayProvinceOnGlobe(selectedEntity.featureGeometry);

            // Reset visual state and hide panel
            if (selectedEntity.point && selectedEntity._originalColor) {
                selectedEntity.point.color = selectedEntity._originalColor;
            }
            selectedEntity = null;
            placePanel.style.display = 'none';

            // Load next province
            loadRandomProvince();
        } else {
            // Incorrect: popup
            alert("Ce n'est pas le bon endroit. Réessayez !");

            // Optionally reset selected point color
            if (selectedEntity && selectedEntity.point && selectedEntity._originalColor) {
                selectedEntity.point.color = selectedEntity._originalColor;
            }
            selectedEntity = null;
            placePanel.style.display = 'none';
        }
