    <style>
        html,
        body {
            min-height: 100vh;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
        }

        #sidebar {
            /* responsive sidebar with min/max using clamp */
            width: clamp(220px, 20%, 420px);
            background: #f4f4f4;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative; /* ensure absolutely positioned footer sits inside sidebar */
            z-index: 9999;
        }

        #sidebarContent {
            flex: 1 1 auto;
            overflow-y: auto;
            /* keep space for the bottom button so it's not overlapped */
            padding-bottom: 12px;
            min-height: 0; /* allow flex child to shrink and enable scrolling */
        }

        /* footer inside sidebar placed by flex; margin-top:auto pushes it to the bottom */
        #sidebarBottom {
            position: relative;
            margin-top: auto;
            background: #fff;
            padding: 8px 0 8px 0;
            border-top: 1px solid #e0e0e0;
            left: 0;
            right: 0;
            z-index: 50; /* ensure visible above tiles */
        }
        /* Make the Skip button non-selectable to avoid interfering with drag gestures */
        #sidebarBottom button {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        /* Prevent selection on tile/title/svg wrapper to avoid blocking drag */
        .tile, .tileTitle, .svg-wrapper, #sidebarContent {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }


        #placedPanel {
            display: none;
            margin-top: 8px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e0e0e0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #burgerButton {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .tile {
            margin: 10px 0;
            padding: 6px;
            background: #fff;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .tileTitle {
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 8px;
            color: #222;
            cursor: grab;
        }

        /* SVG wrapper ensures square SVG */
        .svg-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; /* force square */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
            box-sizing: border-box;
        }

        .svg-wrapper svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            display: block;
            cursor: grab; /* indicate draggable */
        }

        .svg-wrapper svg:active {
            cursor: grabbing;
        }

        .tileLabel {
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            color: #222;
        }

        #cesiumContainer {
            flex: 1 1 auto;
            /* don't use fixed viewport height here; let flexbox distribute space */
            position: relative;
            min-width: 0; /* allow flex children to shrink properly */
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* More specific rules to force the Cesium widget to grow inside the flex container */
        #cesiumContainer > .cesium-viewer,
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport,
        #cesiumContainer > .cesium-viewer, #cesiumContainer > .cesium-viewer .cesium-widget, #cesiumContainer canvas {
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            flex: 1 1 auto;

        #cesiumContainer > .cesium-viewer { display: flex; flex-direction: column; }
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport { flex: 1 1 auto; }

        /* hide default Cesium UI elements we don't want */
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-bottom,
        .cesium-viewer-fullscreenContainer,
        .cesium-button,
        .cesium-navigationHelpButton-wrapper {
            display: none !important;
        }

        /* floating placement button */
        #placeButton {
            position: absolute;
            z-index: 10000;
            display: none;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Notifications */
        #notifications {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20000;
            pointer-events: none; /* allow clicks through container except on notifications */
        }
        .notif {
            min-width: 220px;
            max-width: 380px;
            padding: 10px 14px;
            color: #fff;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            font-weight: 600;
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 220ms ease, transform 220ms ease;
        }
        .notif.hide { opacity: 0; transform: translateY(-8px); }
        .notif.success { background: #2ecc71; }
        .notif.error { background: #e74c3c; }
        .notif.warn { background: #f39c12; }

        function pickDifferentProvince() {

        function getRandomProvince(){ const candidates = file_list.filter(n=>!isPlaced(n)); return candidates.length? candidates[Math.floor(Math.random()*candidates.length)] : null; }

        function createSVGPath(geometry, svgWidth, svgHeight){
            if (!geometry) return '';
            const geom = geometry.type === 'Feature' ? geometry.geometry : geometry;
            if (!geom) return '';

            // collect polygons (support Polygon & MultiPolygon)
            const polygons = [];
            if (geom.type === 'Polygon') {
                polygons.push(...geom.coordinates);
            } else if (geom.type === 'MultiPolygon') {
                geom.coordinates.forEach(mp => polygons.push(...mp));
            } else {
                return '';
            }

            // flatten coords list to compute circular mean longitude
            const coordList = [];
            polygons.forEach(ring => ring.forEach(c => coordList.push(c)));
            if (coordList.length === 0) return '';

            // circular mean lon (antimeridian handling)
            const toRad = d => d * Math.PI / 180;
            const toDeg = r => r * 180 / Math.PI;
            let sumSin = 0, sumCos = 0;
            coordList.forEach(c => { const lon = c[0]; const r = toRad(lon); sumSin += Math.sin(r); sumCos += Math.cos(r); });
            const meanLon = toDeg(Math.atan2(sumSin / coordList.length, sumCos / coordList.length));
            const normalizeLon = lon => { let l = lon; while (l - meanLon > 180) l -= 360; while (l - meanLon < -180) l += 360; return l; };

            // adjusted polygons with normalized longitudes
            const adjusted = polygons.map(ring => ring.map(([lon, lat]) => [normalizeLon(lon), lat]));

            // try to convert to Web Mercator (meters) for accurate scaling across latitudes
            let mercFeature = null;
            try { mercFeature = turf.toMercator({ type: 'Feature', geometry: (adjusted.length && adjusted[0].length ? (geom.type==='Polygon'? { type: 'Polygon', coordinates: adjusted } : { type: 'MultiPolygon', coordinates: [adjusted] }) : geom), properties: {} }); } catch (e) { mercFeature = null; }

            // build rings to render (use merc if available, otherwise degrees)
            let rings = [];
            if (mercFeature && mercFeature.geometry) {
                if (mercFeature.geometry.type === 'Polygon') rings = mercFeature.geometry.coordinates;
                else if (mercFeature.geometry.type === 'MultiPolygon') rings = mercFeature.geometry.coordinates.flat();
            }
            if (!rings.length) {
                // fallback to adjusted degrees rings
                rings = adjusted;
            }

            // compute bbox in chosen coordinate space
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            rings.forEach(r => r.forEach(([x,y]) => { if (typeof x === 'number' && typeof y === 'number') { minX = Math.min(minX,x); maxX = Math.max(maxX,x); minY = Math.min(minY,y); maxY = Math.max(maxY,y); } }));
            if (!isFinite(minX) || !isFinite(maxX) || !isFinite(minY) || !isFinite(maxY)) return '';

            const rangeX = (maxX - minX) || 1e-6;
            const rangeY = (maxY - minY) || 1e-6;

            // margin to avoid touching edges (6px or dynamic %)
            const aspect = rangeX / rangeY;
            const baseFactor = 0.06;
            const largeFactor = 0.12; // bigger margin for extreme aspect ratios
            const marginFactor = (aspect > 8 || aspect < 1/8) ? largeFactor : baseFactor;
            const marginPx = Math.max(6, Math.min(svgWidth, svgHeight) * marginFactor);
             const availW = Math.max(1, svgWidth - 2 * marginPx);
             const availH = Math.max(1, svgHeight - 2 * marginPx);

            // compute scale in selected space
            const scale = Math.min(availW / rangeX, availH / rangeY);
            const usedW = rangeX * scale;
            const usedH = rangeY * scale;
            const padX = (svgWidth - usedW) / 2;
            const padY = (svgHeight - usedH) / 2;

            // construct final path with pixel coordinates (no transform needed)
            let path = '';
            rings.forEach(r => {
                const pts = r.map(([x,y]) => {
                    const px = ((x - minX) * scale) + padX;
                    const py = svgHeight - (((y - minY) * scale) + padY);
                    return `${px.toFixed(2)},${py.toFixed(2)}`;
                }).filter(Boolean);
                if (pts.length) path += `M${pts.join('L')}Z `;
            });

            return path.trim();
        }

        function addPointToGlobe(provinceName, geometry, properties, featureIndex){
            try{
                const center = turf.center(geometry); const [lon,lat]=center.geometry.coordinates;
                const ent = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(lon,lat), point:{ pixelSize:8, color:Cesium.Color.WHITE } });
                ent.provinceName = provinceName;
                ent.featureGeometry = geometry;
                ent.featureProps = properties || null;
                ent.featureIndex = (typeof featureIndex !== 'undefined') ? featureIndex : null;
                // unique per-feature key
                ent.provinceKey = `${provinceName}::${ent.featureIndex}`;
                // store a centroid signature to identify the exact tile/feature
                ent.featureCentroid = `${Number(lon).toFixed(6)},${Number(lat).toFixed(6)}`;
                return ent;
            }catch(e){ return null; }
        }

        async function loadAllFeatures(){
            for(const provinceName of file_list){
                try{ const resp = await fetch(`./states/${provinceName}.json`); if(!resp.ok) continue; const geoJson = await resp.json(); if(geoJson.features && Array.isArray(geoJson.features)) geoJson.features.forEach((f, idx)=> addPointToGlobe(provinceName,f.geometry,f.properties, idx)); }catch(e){/*ignore*/}
            }
        }
        loadAllFeatures();

        async function loadProvinceByName(provinceName){
            if(!provinceName) return;
            try{
                const resp = await fetch(`./states/${provinceName}.json`);
                if(!resp.ok) return;
                const geoJson = await resp.json(); if(geoJson.features && geoJson.features.length>0){
                    // By default we show feature index 0 (first feature) in the sidebar tile.
                    const displayedFeatureIndex = 0;
                    const feat0 = geoJson.features[displayedFeatureIndex];
                    const props=feat0.properties; const geometry=feat0.geometry; const displayName = props.Name_1 || props.Country || provinceName;
                    // set the centroid signature and key for the exact feature we're showing
                    try{
                        const c = turf.center(geometry).geometry.coordinates; currentDisplayedFeatureCentroid = `${Number(c[0]).toFixed(6)},${Number(c[1]).toFixed(6)}`;
                    }catch(e){ currentDisplayedFeatureCentroid = null; }
                    currentDisplayedProvinceKey = `${provinceName}::${displayedFeatureIndex}`;

                    // tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.id = provinceName;
                    // tile is not draggable anymore; the SVG inside is draggable
                    tile.textContent = '';

                    // create square svg wrapper and a label; make SVG draggable (so user drags the svg)
                    const svgWidth = 300, svgHeight = 300; // square svg surface
                    const wrapper = document.createElement('div'); wrapper.className = 'svg-wrapper';
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    svg.style.border = '1px solid #ddd';
                    // Do NOT make the inner <svg> itself draggable; make the wrapper draggable
                    svg.draggable = true;
                    // make the wrapper draggable so dragging works consistently across browsers
                    wrapper.draggable = true;
                    // Make both the svg and the wrapper (and the tile and the title) draggable — attach same handlers
                    svg.draggable = true;
                    wrapper.draggable = true;
                    tile.draggable = true;
                    const onDragStart = (e, el) => {
                        try { e.dataTransfer.setData('text/plain', currentDisplayedProvinceKey || (provinceName + '::0')); } catch (err) {}
                        e.dataTransfer.effectAllowed = 'copy';
                        try { el.classList.add('dragging'); } catch (err) {}
                        // set a drag image using the wrapper if possible
                        try {
                            const rect = wrapper.getBoundingClientRect();
                            e.dataTransfer.setDragImage(wrapper, rect.width / 2, rect.height / 2);
                        } catch (err) { /* ignore */ }
                    };
                    const onDragEnd = (e, el) => { try { el.classList.remove('dragging'); } catch (err) {} };
                    wrapper.addEventListener('dragstart', (e) => onDragStart(e, wrapper));
                    wrapper.addEventListener('dragend', (e) => onDragEnd(e, wrapper));
                    svg.addEventListener('dragstart', (e) => onDragStart(e, svg));
                    svg.addEventListener('dragend', (e) => onDragEnd(e, svg));
                    tile.addEventListener('dragstart', (e) => onDragStart(e, tile));
                    tile.addEventListener('dragend', (e) => onDragEnd(e, tile));

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = createSVGPath(geometry, svgWidth, svgHeight);
                    path.setAttribute('d', d);
                    path.setAttribute('fill', 'rgba(0,123,255,0.5)');
                    path.setAttribute('stroke', '#007bff');
                    path.setAttribute('stroke-width', '1');
                    svg.appendChild(path);
                    wrapper.appendChild(svg);

                    // title above the SVG
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'tileTitle';
                    titleDiv.textContent = displayName;
                    // make the title draggable too (same behaviour as wrapper) to ease drag start
                    titleDiv.draggable = true;
                    titleDiv.addEventListener('dragstart', (e) => {
                        try { e.dataTransfer.setData('text/plain', currentDisplayedProvinceKey); } catch (err) {}
                        e.dataTransfer.effectAllowed = 'copy';
                        titleDiv.classList.add('dragging');
                        try {
                            const rect = titleDiv.getBoundingClientRect();
                            e.dataTransfer.setDragImage(titleDiv, rect.width / 2, rect.height / 2);
                        } catch (err) {}
                    });
                    titleDiv.addEventListener('dragend', () => titleDiv.classList.remove('dragging'));

                     sidebarContent.innerHTML = '';
                    // append title and wrapper inside the tile so the whole tile is one draggable area
                    tile.appendChild(titleDiv);
                    tile.appendChild(wrapper);
                    sidebarContent.appendChild(tile);

                     currentDisplayedProvince = provinceName; currentIndex = file_list.indexOf(provinceName);
                }
            }catch(e){/*ignore*/}
        }

        async function loadRandomProvince(){ const p = getRandomProvince(); if(p) await loadProvinceByName(p); }
        loadRandomProvince();

        // ensure Cesium infoBox is hidden unless we set viewer.selectedEntity on polygons
        if(viewer && viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display='none';

        function displayProvinceOnGlobe(inputGeometry){
            if(!inputGeometry) return;
            const geom = inputGeometry.type==='Feature'? inputGeometry.geometry : inputGeometry;
            if(!geom) return;
            Cesium.GeoJsonDataSource.load({ type:'Feature', geometry:geom, properties:{} }, { clampToGround:false }).then(ds=>{
                // do NOT remove previously placed provinces; keep them visible
                viewer.dataSources.add(ds);
                placedDataSources.push(ds);
                // style polygons in this datasource
                ds.entities.values.forEach(ent=>{ if(ent.polygon){ ent.polygon.material = Cesium.Color.BLUE.withAlpha(0.5); ent.polygon.outline=true; ent.polygon.outlineColor=Cesium.Color.BLACK; } });
            }).catch(()=>{});
        }

        // pick position helpers
        function getCartesianFromDomEvent(e){ const rect = document.getElementById('cesiumContainer').getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; const windowPosition = new Cesium.Cartesian2(x,y); let cart = null; try{ if(viewer.scene.pickPositionSupported) cart = viewer.scene.pickPosition(windowPosition); }catch(e){ cart = null; } if(!cart) cart = viewer.camera.pickEllipsoid(windowPosition, viewer.scene.globe.ellipsoid); return cart; }
        function findNearestPointEntity(cartesian){ if(!cartesian) return null; const ents = viewer.entities.values; let best=null, bestDist=Infinity; const now=Cesium.JulianDate.now(); for(let i=0;i<ents.length;i++){ const ent=ents[i]; if(!ent.provinceName || !ent.position) continue; const pos=ent.position.getValue(now); if(!pos) continue; const d = Cesium.Cartesian3.distance(pos,cartesian); if(d<bestDist){ bestDist=d; best={entity:ent, distance:d}; }} return best; }

        // drag/drop on globe
        const cesiumContainer = document.getElementById('cesiumContainer');
        cesiumContainer.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
        cesiumContainer.addEventListener('drop', e=>{
            e.preventDefault(); const provinceKey = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text');
            if(!provinceKey) return; const cart = getCartesianFromDomEvent(e); if(!cart){ showNotification('Impossible de déterminer l\'endroit sur le globe.', 'error'); return; } const nearest = findNearestPointEntity(cart);
            if(!nearest || !nearest.entity){ showNotification('Aucun point proche trouvé.', 'error'); return; }
            // check both unique provinceKey match AND exact feature centroid match (if available)
            const centroidMatches = currentDisplayedFeatureCentroid && nearest.entity.featureCentroid && (nearest.entity.featureCentroid === currentDisplayedFeatureCentroid);
            if(nearest.entity.provinceKey === provinceKey && centroidMatches){
                // parse provinceName and featureIndex from provinceKey
                const [provinceId, featureIndexStr] = provinceKey.split('::');
                const featureIndex = parseInt(featureIndexStr || '0', 10) || 0;
                // read the specific feature from the file
                fetch(`./states/${provinceId}.json`).then(r=>{ if(!r.ok) throw new Error('fetch'); return r.json(); }).then(json=>{
                   const feat = (json.features && json.features[featureIndex])||null; const displayName = feat && (feat.properties.Name_1 || feat.properties.Country) ? (feat.properties.Name_1 || feat.properties.Country) : provinceId; const country = feat && feat.properties && feat.properties.Country ? feat.properties.Country : null;
                   displayProvinceOnGlobe(nearest.entity.featureGeometry);
                   try{ viewer.entities.remove(nearest.entity); }catch(e){}
                   registerPlacedProvince(provinceId, displayName, country);
                   showNotification(`${displayName} placé !`, 'success');
                   loadRandomProvince();
               }).catch(()=>{ displayProvinceOnGlobe(nearest.entity.featureGeometry); try{ viewer.entities.remove(nearest.entity); }catch(e){} registerPlacedProvince(provinceId, provinceId, null); loadRandomProvince(); });
            } else { showNotification('Ce n\'est pas le bon endroit.', 'error'); }
        });

        // click handler: points stay white; polygons show infoBox and clicking points shows Placer button
        let selectedEntity = null;
        try{
            if(viewer && viewer.scene && viewer.scene.canvas){
                const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
                handler.setInputAction(function(click){
                     try{
                        // save click coordinates for placeButton positioning
                        const clientX = click.position.x, clientY = click.position.y;
                        const picked = viewer.scene.pick(click.position);
                        if (Cesium.defined(picked) && picked.id) {
                            const ent = picked.id;
                            if (ent.polygon) {
                                // show infoBox for polygons
                                try {
                                    const title = ent.name || (ent.properties && ent.properties.Name_1) || 'Province';
                                    let desc = '';
                                    if (ent.properties) {
                                        desc += '<table style="border-collapse:collapse; width:100%">';
                                        for (const k in ent.properties) {
                                            if (!Object.prototype.hasOwnProperty.call(ent.properties, k)) continue;
                                            const v = ent.properties[k];
                                            desc += `<tr><td style="border:1px solid #ddd;padding:4px;font-weight:600">${k}</td><td style="border:1px solid #ddd;padding:4px">${v}</td></tr>`;
                                        }
                                        desc += '</table>';
                                    }
                                    if (viewer.infoBox && viewer.infoBox.viewModel) {
                                        viewer.infoBox.viewModel.title = title;
                                        viewer.infoBox.viewModel.description = desc || 'Aucune donnée disponible.';
                                        if (viewer.infoBox.container) viewer.infoBox.container.style.display = '';
                                    }
                                } catch (e) { /* ignore */ }
                                // hide place button if shown
                                placeButton.style.display = 'none'; selectedPointEntity = null;
                            } else if (ent.point) {
                                // clicked a point: keep it white and show "Placer" button
                                selectedPointEntity = ent;
                                // position the button near the click (convert canvas coords to page coords)
                                const rect = document.getElementById('cesiumContainer').getBoundingClientRect();
                                placeButton.style.left = (rect.left + clientX + 8) + 'px';
                                placeButton.style.top = (rect.top + clientY + 8) + 'px';
                                placeButton.style.display = 'block';
                                // ensure infoBox hidden for points
                                try { if (viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display = 'none'; } catch (e) {}
                            } else {
                                // clicked something else: hide place button and update UI
                                placeButton.style.display = 'none'; selectedPointEntity = null;
                                try { if (viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display = 'none'; } catch (e) {}
                            }
                        } else {
                            // nothing picked: hide place button / infoBox
                            placeButton.style.display = 'none'; selectedPointEntity = null;
                            try { if (viewer.infoBox && viewer.infoBox.container) viewer.infoBox.container.style.display = 'none'; } catch (e) {}
                        }
                     }catch(e){}
                 }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
            }
        }catch(e){}

        // placeButton behavior: when clicked, try to place the clicked point's province compared to currentDisplayedProvince
        if (placeButton) {
            placeButton.addEventListener('click', () => {
                placeButton.style.display = 'none';
                if (!selectedPointEntity) return;
                const clickedKey = selectedPointEntity.provinceKey;
                if (!clickedKey) return;
                // ensure we match the exact feature key and centroid
                const centroidMatches = currentDisplayedFeatureCentroid && selectedPointEntity.featureCentroid && (selectedPointEntity.featureCentroid === currentDisplayedFeatureCentroid);
                if (clickedKey === currentDisplayedProvinceKey && centroidMatches) {
                    // correct placement: show polygon, remove the point, register and load next
                    try {
                        displayProvinceOnGlobe(selectedPointEntity.featureGeometry);
                    } catch (e) {}
                    try { viewer.entities.remove(selectedPointEntity); } catch (e) {}
                    // attempt to read displayName/country and register
                    const [provinceId, featureIndexStr] = clickedKey.split('::'); const featureIndex = parseInt(featureIndexStr||'0',10) || 0;
                    fetch(`./states/${provinceId}.json`).then(r=>{ if(!r.ok) throw new Error('fetch'); return r.json(); }).then(json=>{
                        const feat = (json.features && json.features[featureIndex])||null; const displayName = feat && (feat.properties.Name_1 || feat.properties.Country) ? (feat.properties.Name_1 || feat.properties.Country) : provinceId; const country = feat && feat.properties && feat.properties.Country ? feat.properties.Country : null;
                        registerPlacedProvince(provinceId, displayName, country);
                        showNotification(`${displayName} placé !`, 'success');
                        loadRandomProvince();
                    }).catch(()=>{
                        registerPlacedProvince(provinceId, provinceId, null);
                        showNotification(`${provinceId} placé (données incomplètes).`, 'warn');
                        loadRandomProvince();
                    });
                } else {
                    showNotification('Ce n\'est pas le bon endroit.', 'error');
                }
                selectedPointEntity = null;
            });
            // hide it when clicking elsewhere (global click)
            document.addEventListener('click', (e)=>{
                // if click is not on the placeButton itself, hide it
                if (!placeButton.contains(e.target)) { placeButton.style.display = 'none'; selectedPointEntity = null; }
            });
        }

        // Skip button
        if(skipSidebar){ skipSidebar.addEventListener('click', e=>{ e.preventDefault(); selectedEntity=null; const next = pickDifferentProvince() || getRandomProvince(); if(!next) return; skipSidebar.disabled=true; loadProvinceByName(next).finally(()=>{ skipSidebar.disabled=false; }); }); }

        // burger toggle
        if(burgerButton){ burgerButton.addEventListener('click', ()=>{ if(!placedPanel) return; placedPanel.style.display = placedPanel.style.display==='block'?'none':'block'; }); }

    </script>
</body>
