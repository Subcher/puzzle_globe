    <style>
        html,
        body {
            min-height: 100vh;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
        }

        #sidebar {
            /* responsive sidebar with min/max using clamp */
            width: clamp(220px, 20%, 420px);
            background: #f4f4f4;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative; /* ensure absolutely positioned footer sits inside sidebar */
            z-index: 9999;
        }

        #sidebarContent {
            flex: 1 1 auto;
            overflow-y: auto;
            /* keep space for the bottom button so it's not overlapped */
            padding-bottom: 12px;
            min-height: 0; /* allow flex child to shrink and enable scrolling */
        }

        /* footer inside sidebar placed by flex; margin-top:auto pushes it to the bottom */
        #sidebarBottom {
            position: relative;
            margin-top: auto;
            background: #fff;
            padding: 8px 0 8px 0;
            border-top: 1px solid #e0e0e0;
            left: 0;
            right: 0;
            z-index: 50; /* ensure visible above tiles */
        }
        /* Make the Skip button non-selectable to avoid interfering with drag gestures */
        #sidebarBottom button {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        /* Prevent selection on tile/title/svg wrapper to avoid blocking drag */
        .tile, .tileTitle, .svg-wrapper, #sidebarContent {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }


        #placedPanel {
            display: none;
            margin-top: 8px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e0e0e0;
            max-height: 40vh;
            overflow-y: auto;
        }

        #burgerButton {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .tile {
            margin: 10px 0;
            padding: 6px;
            background: #fff;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .tileTitle {
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 8px;
            color: #222;
            cursor: grab;
        }

        /* SVG wrapper ensures square SVG */
        .svg-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; /* force square */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
            box-sizing: border-box;
        }

        .svg-wrapper svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            display: block;
            cursor: grab; /* indicate draggable */
        }

        .svg-wrapper svg:active {
            cursor: grabbing;
        }

        .tileLabel {
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            color: #222;
        }

        #cesiumContainer {
            flex: 1 1 auto;
            /* don't use fixed viewport height here; let flexbox distribute space */
            position: relative;
            min-width: 0; /* allow flex children to shrink properly */
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* More specific rules to force the Cesium widget to grow inside the flex container */
        #cesiumContainer > .cesium-viewer,
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport,
        #cesiumContainer > .cesium-viewer, #cesiumContainer > .cesium-viewer .cesium-widget, #cesiumContainer canvas {
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            flex: 1 1 auto;
        }
        /* ensure the direct viewer element grows to fill the parent */
        #cesiumContainer > .cesium-viewer { display: flex; flex-direction: column; }
        #cesiumContainer > .cesium-viewer .cesium-widget-viewport { flex: 1 1 auto; }

        /* hide default Cesium UI elements we don't want */
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-bottom,
        .cesium-viewer-fullscreenContainer,
        .cesium-button,
        .cesium-navigationHelpButton-wrapper {
            display: none !important;
        }

        /* floating placement button */
        #placeButton {
            position: absolute;
            z-index: 10000;
            display: none;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Notifications */
        #notifications {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20000;
            pointer-events: none; /* allow clicks through container except on notifications */
        }
        .notif {
            min-width: 220px;
            max-width: 380px;
            padding: 10px 14px;
            color: #fff;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            font-weight: 600;
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 220ms ease, transform 220ms ease;
        }
        .notif.hide { opacity: 0; transform: translateY(-8px); }
        .notif.success { background: #2ecc71; }
        .notif.error { background: #e74c3c; }
        .notif.warn { background: #f39c12; }

        /* flag images sized to font-size */
        .flag {
            height: 1em; /* same height as current font */
            width: auto;
            margin-right: 4px; /* tighter spacing */
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            background: #fff;

            height: 16px;

            flex: 0 0 auto;

            display: flex;

            gap: 4px; /* tighter gap */

            font-weight: 700;
            font-size: 14px;
            line-height: 1.2;

        #placedPanel ul { margin:6px 0 12px 14px; padding:0; }
        #placedPanel li { margin:4px 0; list-style: disc; }

        #progressWrap { padding: 8px 12px; box-sizing: border-box; }
        #progressLabel { font-size: 13px; font-weight: 700; color: #222; margin-bottom: 6px; }
        #progressBar { width: 100%; height: 10px; background: #e6e6e6; border-radius: 999px; overflow: hidden; }
        #progressFill { width: 0%; height: 100%; background: linear-gradient(90deg,#10b981,#06b6d4); transition: width 300ms ease; }

    </style>

    function showNotification(message, type = 'success', ttl = 3500) {
        try {
            if (!notifications) return;
            const n = document.createElement('div');
            n.className = 'notif ' + (type || 'success');

            setTimeout(() => { n.classList.add('hide'); setTimeout(() => { try { notifications.removeChild(n); } catch (e) {} }, 260); }, ttl);

    // state
    let currentDisplayedProvince = null;
    let currentDisplayedProvinceKey = null; // unique key provinceName::featureIndex for the tile shown
    let currentDisplayedFeatureCentroid = null; // centroid string 'lon,lat' of the feature shown in sidebar
    let currentIndex = -1;
    const placedProvinces = []; // { name, displayName, country, flag }
    const placedDataSources = []; // keep all placed GeoJsonDataSource objects so they remain visible
    let lastDataSource = null;
    let selectedPointEntity = null; // for click-to-place flow
    // attempts per displayed feature key
    const attemptsByKey = {}; // persistent attempts per province::featureIndex
    // currently displayed tile flag (from states/*.json -> flag property)
    let currentDisplayedFlag = null;
    // score tracking
    let score = 0;

    function updateScoreDisplay(){ const el = document.getElementById('scoreDisplay'); if(el) el.textContent = `Score: ${score}`; }

    // Progress bar helpers
    function getTotalFeatureCount(){
        try{
            const ents = (viewer && viewer.entities && Array.isArray(viewer.entities.values)) ? viewer.entities.values : [];
            const set = new Set();
            for(const ent of ents){ if(ent && ent.provinceKey) set.add(ent.provinceKey); }
            // also include placed entries that might have removed entities
            for(const p of placedProvinces){ if(p && p.key) set.add(p.key); else if(p && p.name){ /* add a generic name-based key to count */ set.add(p.name + '::0'); } }
            return set.size;
        }catch(e){ return 0; }
    }

    function updateProgressBar(){
        try{
            const total = getTotalFeatureCount() || file_list.length || 0;
            const placed = placedProvinces ? placedProvinces.length : 0;
            const pct = total > 0 ? Math.round((placed / total) * 100) : 0;
            const lbl = document.getElementById('progressLabel'); const fill = document.getElementById('progressFill');
            if(lbl) lbl.textContent = `Placées ${placed} / ${total} provinces`;
            if(fill) fill.style.width = pct + '%';
        }catch(e){}
    }

    function isPlaced(name) { return isProvincePlaced(name); }
    // register a placed province; optional `flag`, unique `key` and `attempts`
    // To support multi-word country names we store both a normalized `countryKey` (for grouping)
    // and the original `country` label (for display). This avoids breaking grouping logic while
    // showing country names with spaces/accents correctly.
    function registerPlacedProvince(name, displayName, country /*, flag, key, attempts */) {
        const flag = (arguments.length >= 4) ? arguments[3] : null;
        const key = (arguments.length >= 5) ? arguments[4] : null;
        const attempts = (arguments.length >= 6) ? arguments[5] : null;
        // avoid duplicates by key if provided, otherwise by name
        if (key) {
            if (placedProvinces.some(p => p.key === key)) return;
        } else {
            if (isPlaced(name)) return;
        }
        // store the country label as provided (display label). Keep grouping by this field.
        const countryLabel = (typeof country === 'string' && country.trim().length>0) ? country.trim() : null;
        const entry = { name, displayName, country: countryLabel };
        // compute and store a normalized name to make future comparisons robust
        try{
            const norm = (name || displayName || '').toString().trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[^a-z0-9]/g,'');
            entry.normName = norm;
        }catch(e){ entry.normName = (name || displayName || '').toString().trim().toLowerCase(); }
        if (flag) entry.flag = flag;
        if (key) entry.key = key;
        if (typeof attempts === 'number') entry.attempts = attempts;
        placedProvinces.push(entry);
        updatePlacedPanel();
        updateScoreDisplay();
        // refresh progress UI
        try{ updateProgressBar(); }catch(e){}
     }

    function updatePlacedPanel() {
        if (!placedPanel) return;
        placedPanel.innerHTML = '';
        const groups = {};
        placedProvinces.forEach(p => { const k = p.country || 'Unknown'; (groups[k] = groups[k] || []).push(p); });
        // sort country names alphabetically (locale-aware)
        const countryKeys = Object.keys(groups).sort((a,b)=> a.localeCompare(b, 'fr', { sensitivity: 'base' }));
        countryKeys.forEach(country => {
            const items = (groups[country] || []).slice().sort((x,y)=> {
                const a = (x.displayName || x.name || '').toString();
                const b = (y.displayName || y.name || '').toString();
                return a.localeCompare(b, 'fr', { sensitivity: 'base' });
            });

            // header row: small country flag on left (if available) + country name
            const header = document.createElement('div');
            header.className = 'country-header';

            // pick a flag for the country from any item that has it
            let groupFlag = null;
            for (const it of items) { if (it && it.flag) { groupFlag = it.flag; break; } }
            if (groupFlag) {
                const img = document.createElement('img');
                img.className = 'country-flag';
                img.alt = country + ' flag';
                img.src = groupFlag;
                img.onerror = () => { try { img.style.display = 'none'; } catch (e) {} };
                header.appendChild(img);
            }

            const h = document.createElement('div');
            h.textContent = country;
            header.appendChild(h);
            placedPanel.appendChild(header);

            // provinces as a simple bullet list (no flags)

            });

    function pickDifferentProvince() {
        if (!file_list || file_list.length === 0) return null;
        let startIdx = (currentIndex >= 0 && currentIndex < file_list.length) ? (currentIndex + 1) % file_list.length : 0;

    function getRandomProvince(){ const candidates = file_list.filter(n=>!isPlaced(n)); return candidates.length? candidates[Math.floor(Math.random()*candidates.length)] : null; }

    function createSVGPath(geometry, svgWidth, svgHeight){
        if (!geometry) return '';
        const geom = geometry.type === 'Feature' ? geometry.geometry : geometry;
        if (!geom) return '';

        // collect polygons (support Polygon & MultiPolygon)
        const polygons = [];
        if (geom.type === 'Polygon') {
            polygons.push(...geom.coordinates);
        } else if (geom.type === 'MultiPolygon') {
            geom.coordinates.forEach(mp => polygons.push(...mp));
        } else {
            return '';
        }

        // flatten coords list to compute circular mean longitude
        const coordList = [];
        polygons.forEach(ring => ring.forEach(c => coordList.push(c)));
        if (coordList.length === 0) return '';

        // circular mean lon (antimeridian handling)
        const toRad = d => d * Math.PI / 180;
        const toDeg = r => r * 180 / Math.PI;
        let sumSin = 0, sumCos = 0;
        coordList.forEach(c => { const lon = c[0]; const r = toRad(lon); sumSin += Math.sin(r); sumCos += Math.cos(r); });
        const meanLon = toDeg(Math.atan2(sumSin / coordList.length, sumCos / coordList.length));
        const normalizeLon = lon => { let l = lon; while (l - meanLon > 180) l -= 360; while (l - meanLon < -180) l += 360; return l; };

        // adjusted polygons with normalized longitudes
        const adjusted = polygons.map(ring => ring.map(([lon, lat]) => [normalizeLon(lon), lat]));

        // try to convert to Web Mercator (meters) for accurate scaling across latitudes
        let mercFeature = null;
        try { mercFeature = turf.toMercator({ type: 'Feature', geometry: (adjusted.length && adjusted[0].length ? (geom.type==='Polygon'? { type: 'Polygon', coordinates: adjusted } : { type: 'MultiPolygon', coordinates: [adjusted] }) : geom), properties: {} }); } catch (e) { mercFeature = null; }

        // build rings to render (use merc if available, otherwise degrees)
        let rings = [];
        if (mercFeature && mercFeature.geometry) {
            if (mercFeature.geometry.type === 'Polygon') rings = mercFeature.geometry.coordinates;
            else if (mercFeature.geometry.type === 'MultiPolygon') rings = mercFeature.geometry.coordinates.flat();
        }
        if (!rings.length) {
            // fallback to adjusted degrees rings
            rings = adjusted;
        }

        // compute bbox in chosen coordinate space
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        rings.forEach(r => r.forEach(([x,y]) => { if (typeof x === 'number' && typeof y === 'number') { minX = Math.min(minX,x); maxX = Math.max(maxX,x); minY = Math.min(minY,y); maxY = Math.max(maxY,y); } }));
        if (!isFinite(minX) || !isFinite(maxX) || !isFinite(minY) || !isFinite(maxY)) return '';

        const rangeX = (maxX - minX) || 1e-6;
        const rangeY = (maxY - minY) || 1e-6;

        // margin to avoid touching edges (6px or dynamic %)
        const aspect = rangeX / rangeY;
        const baseFactor = 0.06;
        const largeFactor = 0.12; // bigger margin for extreme aspect ratios
        const marginFactor = (aspect > 8 || aspect < 1/8) ? largeFactor : baseFactor;
        const marginPx = Math.max(6, Math.min(svgWidth, svgHeight) * marginFactor);
        const availW = Math.max(1, svgWidth - 2 * marginPx);
        const availH = Math.max(1, svgHeight - 2 * marginPx);

        // compute scale in selected space
        const scale = Math.min(availW / rangeX, availH / rangeY);
        const usedW = rangeX * scale;
        const usedH = rangeY * scale;
        const padX = (svgWidth - usedW) / 2;
        const padY = (svgHeight - usedH) / 2;

    // Robust parallel loader for state files with timeout and limited concurrency.
    async function loadAllFeatures(){
        const concurrency = 6; // number of parallel fetches
        // No blacklist: try to load all files (user requested that large files be loaded too).
        const queue = file_list.slice();
        const skipped = []; // collect failed files during loading

        async function fetchWithTimeout(url, timeoutMs = 10000){
            const controller = new AbortController();
            const id = setTimeout(()=> controller.abort(), timeoutMs);
            try{
                const resp = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return resp;
            }catch(err){
                clearTimeout(id);
                throw err;
            }
        }

        async function worker(){
            while(queue.length){
                const name = queue.shift();
                if(!name) break;
                try{
                    const resp = await fetchWithTimeout(`./states/${name}.json`, 12000);
                    if(!resp || !resp.ok){
                        skipped.push(name);
                        continue;
                    }
                    // try parse JSON; large files may cost time but are handled per-worker
                    let geoJson = null;
                    try{ geoJson = await resp.json(); }catch(err){ skipped.push(name); continue; }
                    if(geoJson && geoJson.features && Array.isArray(geoJson.features)){
                        geoJson.features.forEach((f, idx)=> {
                            try{ addPointToGlobe(name, f.geometry, f.properties, idx); }catch(e){}
                        });
                    }
                }catch(err){
                    // fetch aborted or other network error — skip this file
                    skipped.push(name);
                }
            }
        }

        const workers = [];
        for(let i=0;i<concurrency;i++) workers.push(worker());
        await Promise.all(workers);
        if(skipped.length){ console.warn('Skipped state files (failed to load or excluded):', skipped); showNotification(`${skipped.length} large/failed files skipped during load.`, 'warn', 6000); }
        else { showNotification('All state point files loaded.', 'success', 2200); }
        try{ updateProgressBar(); }catch(e){}
     }

            position: 'fixed',
            right: '16px',
            bottom: '72px',
            width: '320px',
            maxWidth: 'calc(100vw - 40px)',
            background: '#fff',
            boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
            padding: '10px',
            borderRadius: '8px',
            zIndex: 20000,
            display: 'none',
            boxSizing: 'border-box'
        });

        savePanel.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
                <strong>Save progress</strong>
                <button id="closeSavePanel" style="border:none;background:transparent;cursor:pointer;font-size:16px;">✕</button>
            </div>
            <div style="font-size:13px;color:#333;margin-bottom:8px;">Export your progress to a JSON file or import a previously exported file.</div>
            <div style="display:flex;gap:8px;">
                <button id="exportBtn" style="flex:1;padding:8px;border-radius:6px;border:none;background:#10b981;color:#fff;cursor:pointer;">Export JSON</button>
                <input id="importFile" type="file" accept="application/json" style="display:none">
                <button id="importBtn" style="flex:1;padding:8px;border-radius:6px;border:none;background:#2563eb;color:#fff;cursor:pointer;">Import JSON</button>
            </div>
            <div style="font-size:12px;color:#666;margin-top:8px;">Note: importing replaces currently placed provinces in the UI and attempts to restore polygons on the globe.</div>
        `;
        document.body.appendChild(savePanel);

        const closeSavePanel = savePanel.querySelector('#closeSavePanel');
        const exportBtn = savePanel.querySelector('#exportBtn');
        const importBtn = savePanel.querySelector('#importBtn');
        const importFile = savePanel.querySelector('#importFile');

        saveBtn.addEventListener('click', ()=>{ savePanel.style.display = savePanel.style.display==='block' ? 'none' : 'block'; });
        closeSavePanel.addEventListener('click', ()=>{ savePanel.style.display='none'; });

        function exportProgressToFile(){
            try{
                const data = {
                    meta: { exportedAt: (new Date()).toISOString(), totalStates: file_list.length },
                    placedProvinces: placedProvinces.slice(),
                    score: score,
                    attemptsByKey: attemptsByKey
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `puzzle_globe_progress_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
                document.body.appendChild(a);
                a.click();
                setTimeout(()=>{ try{ URL.revokeObjectURL(url); document.body.removeChild(a); }catch(e){} }, 500);
                showNotification('Progress exported.', 'success');
            }catch(e){ showNotification('Export failed.', 'error'); }
        }

        function importProgressFromFile(file){
            if(!file) return;
            const fr = new FileReader();
            fr.onload = async (ev) => {
                try{
                    const parsed = JSON.parse(ev.target.result);
                    if(!parsed || !Array.isArray(parsed.placedProvinces)) { showNotification('Fichier invalide.', 'error'); return; }
                    // replace placedProvinces contents
                    placedProvinces.length = 0;
                    parsed.placedProvinces.forEach(p => placedProvinces.push(p));
                    // ensure each imported entry has a country property (fallback to null if missing)
                    try{
                        placedProvinces.forEach(ent => {
                            if(!ent) return;
                            if(ent.country === undefined) ent.country = null;
                        });
                    }catch(e){}
                    // compute a normalized name (normName) for each imported entry to ensure detection works
                    try{
                        placedProvinces.forEach(ent => {
                            if(!ent) return;
                            if(!ent.normName){
                                try{ ent.normName = (ent.name || ent.displayName || '').toString().trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[^a-z0-9]/g,''); }
                                catch(e){ ent.normName = (ent.name || ent.displayName || '').toString().trim().toLowerCase(); }
                            }
                        });
                    }catch(e){}
                    // restore score and attempts
                    try{ score = Number(parsed.score) || 0; updateScoreDisplay(); }catch(e){}
                    try{ Object.keys(attemptsByKey).forEach(k=>delete attemptsByKey[k]); if(parsed.attemptsByKey && typeof parsed.attemptsByKey === 'object') Object.assign(attemptsByKey, parsed.attemptsByKey); }catch(e){}
                     updatePlacedPanel();
                    try{ updateProgressBar(); }catch(e){}
                     showNotification('Progress imported. Restoring on globe...', 'success');
                    // attempt to restore polygons on globe by fetching the state files for each placed entry
                    for(const entry of placedProvinces){
                        try{
                            const name = entry.name;
                            const key = entry.key || null; // optional per-feature key (e.g., 'Guernsey::0')
                            const resp = await fetch(`./states/${name}.json`);
                            if(!resp.ok) continue;
                            const json = await resp.json();
                            let featureIndex = 0;
                            if(key && typeof key === 'string'){
                                const split = key.split('::');
                                if(split.length===2) featureIndex = parseInt(split[1]||'0',10) || 0;
                            }
                            const feat = (json.features && json.features[featureIndex]) || json.features && json.features[0];
                            if(feat && feat.geometry){ displayProvinceOnGlobe(feat.geometry); }
                            // remove the point entity corresponding to this feature (if present)
                            try{
                                const keyToRemove = (key ? key : `${name}::${featureIndex}`);
                                const ents = viewer.entities.values.slice();
                                for(const ent of ents){ if(ent && ent.provinceKey === keyToRemove){ try{ viewer.entities.remove(ent); }catch(e){} } }
                            }catch(e){}
                        }catch(e){ /* ignore per-entry errors */ }
                    }
                    updatePlacedPanel();
                    try{ updateProgressBar(); }catch(e){}
                 }catch(e){ showNotification('Import failed: fichier invalide.', 'error'); }
            };
            fr.onerror = ()=> showNotification('Failed to read file.', 'error');
            fr.readAsText(file);
        }

        exportBtn.addEventListener('click', exportProgressToFile);
        importBtn.addEventListener('click', ()=> importFile.click());
        importFile.addEventListener('change', (ev)=>{ const f = ev.target.files && ev.target.files[0]; if(f) importProgressFromFile(f); importFile.value = ''; });
    }catch(e){ /* non-blocking */ }

    function getRandomFeatureKey() {
        // Select a country at random (excluding provinces already placed), then a random unplaced feature inside it.
        try {
            const ents = (viewer && viewer.entities && Array.isArray(viewer.entities.values)) ? viewer.entities.values : [];
            // build list of candidate countries that are not already placed
            const candidates = file_list.filter(c => !isProvincePlaced(c));

            // shuffle candidate countries to randomize selection order
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1)); [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }

            // try each candidate country until we find an unplaced feature
            for (const country of candidates) {
                // gather entities for this country
                const countryEnts = ents.filter(ent => ent && ent.provinceName === country && ent.provinceKey);
                // prefer an unplaced feature among loaded entities
                const unplacedKeys = countryEnts.filter(ent => !isFeaturePlaced(ent.provinceKey)).map(ent => ent.provinceKey);
                if (unplacedKeys.length) {
                    return unplacedKeys[Math.floor(Math.random() * unplacedKeys.length)];
                }
                // if no entities loaded yet for this country, try to return a safe default feature index 0
                if (!countryEnts.length) {
                    const candidateKey = `${country}::0`;
                    if (!isFeaturePlaced(candidateKey)) return candidateKey;
                }
                // otherwise continue to next candidate country
            }
        } catch (e) { /* ignore and fallback below */ }

        // fallback: attempt to pick any unplaced feature key from currently loaded entities
        try{
            const keys = getAllUnplacedFeatureKeysFromEntities();
            if (keys && keys.length) return keys[Math.floor(Math.random() * keys.length)];
        }catch(e){}

        // final fallback: choose a random province file that is not marked placed and return ::0
        const fallbackCandidates = file_list.filter(n => !isProvincePlaced(n));
        if (!fallbackCandidates.length) return null;
        const chosen = fallbackCandidates[Math.floor(Math.random() * fallbackCandidates.length)];
        return `${chosen}::0`;
    }

</script>
</body>
